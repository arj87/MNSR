<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#0c0d11; font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="ar-flow" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="ar-cut" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <text x="600" y="32" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="1">FIGURE 4.4: LIQUIDITY ROUTING &amp; MAX-FLOW / MIN-CUT BOTTLENECK ANALYSIS</text>
  <text x="600" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Edmonds-Karp Residual Augmentation (SBI → Canara) &amp; Min-Cut Capacity Equivalence</text>

  <g transform="translate(20, 65)" filter="url(#card-shadow)">
    <!-- Header -->
    <rect width="1160" height="42" rx="6" fill="#121419" stroke="#222631" stroke-width="1"/>
    <text x="24" y="26" fill="#f8fafc" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace" letter-spacing="1">MNSR ENGINE</text>
    <circle cx="1060" cy="21" r="4" fill="#10b981"/>
    <text x="1072" y="25" fill="#94a3b8" font-size="10" font-family="monospace">CONNECTED</text>

    <!-- Navigation Bar -->
    <rect y="42" width="1160" height="36" fill="#121419" stroke="#222631" stroke-width="1"/>
    <text x="85" y="64" text-anchor="middle" fill="#64748b" font-size="11">Network Topology</text>
    <text x="225" y="64" text-anchor="middle" fill="#64748b" font-size="11">Multilateral Netting</text>
    <text x="365" y="64" text-anchor="middle" fill="#64748b" font-size="11">Settlement &amp; Gridlock</text>
    <!-- Active Tab: Liquidity -->
    <rect x="445" y="42" width="130" height="36" fill="rgba(56,189,248,0.06)"/>
    <line x1="445" y1="77" x2="575" y2="77" stroke="#38bdf8" stroke-width="2"/>
    <text x="510" y="64" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Liquidity &amp; Flow</text>
    <text x="630" y="64" text-anchor="middle" fill="#64748b" font-size="11">Crisis Simulator</text>
    <text x="750" y="64" text-anchor="middle" fill="#64748b" font-size="11">Regulator Toolkit</text>

    <!-- Canvas -->
    <rect y="78" width="820" height="600" fill="#0c0d11"/>

    <!-- Augmenting Paths (Cyan Flow Highlight) -->
    <!-- Path 1: SBI -> HDFC -> Axis -> Kotak -> Canara -->
    <path d="M 220 220 A 400 400 0 0 1 440 180" fill="none" stroke="#38bdf8" stroke-width="4.5" marker-end="url(#ar-flow)"/>
    <path d="M 440 180 A 400 400 0 0 1 640 260" fill="none" stroke="#38bdf8" stroke-width="4.5" marker-end="url(#ar-flow)"/>
    
    <!-- Path 2: SBI -> ICICI -->
    <path d="M 220 220 A 400 400 0 0 1 300 420" fill="none" stroke="#38bdf8" stroke-width="4.5" marker-end="url(#ar-flow)"/>

    <!-- Min-Cut Bottleneck Links (Dashed Crimson Line, highlighted) -->
    <path d="M 300 420 A 400 400 0 0 1 450 540" fill="none" stroke="#e11d48" stroke-width="4.5" stroke-dasharray="6,4" marker-end="url(#ar-cut)"/>
    <rect x="360" y="470" width="70" height="18" rx="4" fill="#450a0a" stroke="#e11d48"/>
    <text x="395" y="483" text-anchor="middle" fill="#fca5a5" font-size="9" font-family="monospace" font-weight="700">BOTTLENECK</text>

    <path d="M 450 540 A 400 400 0 0 1 200 540" fill="none" stroke="#e11d48" stroke-width="4.5" stroke-dasharray="6,4" marker-end="url(#ar-cut)"/>
    <rect x="300" y="525" width="70" height="18" rx="4" fill="#450a0a" stroke="#e11d48"/>
    <text x="335" y="538" text-anchor="middle" fill="#fca5a5" font-size="9" font-family="monospace" font-weight="700">BOTTLENECK</text>

    <!-- Path to Sink: Yes_Bank -> Canara -->
    <path d="M 200 540 A 400 400 0 0 1 120 380" fill="none" stroke="#38bdf8" stroke-width="4.5" marker-end="url(#ar-flow)"/>

    <!-- Nodes: Source (SBI) & Sink (Canara) Highlighted -->
    <!-- SOURCE NODE: SBI -->
    <g transform="translate(220, 220)">
      <circle r="36" fill="#042f2e" stroke="#38bdf8" stroke-width="4"/>
      <circle r="22" fill="#28549C"/>
      <text y="50" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">SOURCE: SBI</text>
    </g>

    <g transform="translate(440, 180)"><circle r="28" fill="#14161c" stroke="#004C8F" stroke-width="3"/><text y="4" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">HDFC</text></g>
    <g transform="translate(640, 260)"><circle r="27" fill="#14161c" stroke="#97144D" stroke-width="3"/><text y="4" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Axis</text></g>
    <g transform="translate(300, 420)"><circle r="28" fill="#14161c" stroke="#F58220" stroke-width="3"/><text y="4" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">ICICI</text></g>
    <g transform="translate(450, 540)"><circle r="26" fill="#14161c" stroke="#A20034" stroke-width="3"/><text y="4" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">PNB</text></g>
    <g transform="translate(200, 540)"><circle r="26" fill="#14161c" stroke="#005CA9" stroke-width="3"/><text y="4" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">YES</text></g>

    <!-- SINK NODE: Canara -->
    <g transform="translate(120, 380)">
      <circle r="36" fill="#450a0a" stroke="#e11d48" stroke-width="4"/>
      <circle r="22" fill="#0091DF"/>
      <text y="50" text-anchor="middle" fill="#e11d48" font-size="11" font-weight="700">SINK: CANARA</text>
    </g>

    <!-- ================= RIGHT SIDEBAR ================= -->
    <g transform="translate(820, 78)">
      <rect width="340" height="600" fill="#121419" stroke="#222631" stroke-width="1"/>

      <!-- Panel: Configuration -->
      <g transform="translate(16, 16)">
        <rect width="308" height="150" rx="6" fill="#181a21" stroke="#222631"/>
        <text x="14" y="20" fill="#64748b" font-size="10" font-weight="700" font-family="monospace">FLOW ROUTING PARAMETERS</text>

        <text x="14" y="42" fill="#94a3b8" font-size="9.5">LIQUIDITY SOURCE</text>
        <rect x="14" y="48" width="280" height="26" rx="3" fill="#111317" stroke="#38bdf8"/>
        <text x="24" y="65" fill="#38bdf8" font-size="10" font-weight="600">SBI (State Bank of India)</text>

        <text x="14" y="92" fill="#94a3b8" font-size="9.5">LIQUIDITY SINK</text>
        <rect x="14" y="98" width="280" height="26" rx="3" fill="#111317" stroke="#e11d48"/>
        <text x="24" y="115" fill="#fca5a5" font-size="10" font-weight="600">Canara Bank</text>

        <rect x="14" y="132" width="280" height="26" rx="4" fill="#38bdf8"/>
        <text x="154" y="149" text-anchor="middle" fill="#0c0d11" font-size="10" font-weight="700">COMPUTE EDMONDS-KARP MAX FLOW</text>
      </g>

      <!-- Panel: Capacity Metrics -->
      <g transform="translate(16, 180)">
        <rect width="308" height="130" rx="6" fill="#181a21" stroke="#222631"/>
        <text x="14" y="20" fill="#64748b" font-size="10" font-weight="700" font-family="monospace">EQUIVALENCE PROOF METRICS</text>

        <rect x="14" y="32" width="135" height="44" rx="4" fill="#111317" stroke="#222631"/>
        <text x="24" y="47" fill="#64748b" font-size="9">MAX FLOW</text>
        <text x="24" y="67" fill="#38bdf8" font-size="15" font-weight="700" font-family="monospace">₹720 Cr</text>

        <rect x="159" y="32" width="135" height="44" rx="4" fill="#111317" stroke="#222631"/>
        <text x="169" y="47" fill="#64748b" font-size="9">MIN CUT CAPACITY</text>
        <text x="169" y="67" fill="#e11d48" font-size="15" font-weight="700" font-family="monospace">₹720 Cr</text>

        <rect x="14" y="84" width="280" height="34" rx="4" fill="#111317" stroke="#222631"/>
        <text x="24" y="98" fill="#64748b" font-size="9">AUGMENTING PATHS</text>
        <text x="24" y="112" fill="#d97706" font-size="12" font-weight="700" font-family="monospace">3 Residual Paths Explored</text>
      </g>

      <!-- Panel: Bottleneck List -->
      <g transform="translate(16, 325)">
        <rect width="308" height="245" rx="6" fill="#181a21" stroke="#222631"/>
        <text x="14" y="20" fill="#64748b" font-size="10" font-weight="700" font-family="monospace">MIN-CUT BOTTLENECK CHOKEPOINTS</text>

        <rect x="14" y="34" width="280" height="42" rx="4" fill="#111317" stroke="rgba(225,29,72,0.4)"/>
        <text x="24" y="52" fill="#f8fafc" font-size="10.5" font-weight="600">PNB → Yes_Bank</text>
        <text x="24" y="66" fill="#e11d48" font-size="9.5" font-family="monospace">Cut Weight: ₹150 Cr (Saturated)</text>

        <rect x="14" y="84" width="280" height="42" rx="4" fill="#111317" stroke="rgba(225,29,72,0.4)"/>
        <text x="24" y="102" fill="#f8fafc" font-size="10.5" font-weight="600">ICICI → PNB</text>
        <text x="24" y="116" fill="#e11d48" font-size="9.5" font-family="monospace">Cut Weight: ₹250 Cr (Saturated)</text>

        <rect x="14" y="134" width="280" height="42" rx="4" fill="#111317" stroke="rgba(225,29,72,0.4)"/>
        <text x="24" y="152" fill="#f8fafc" font-size="10.5" font-weight="600">Kotak → SBI</text>
        <text x="24" y="166" fill="#e11d48" font-size="9.5" font-family="monospace">Cut Weight: ₹320 Cr (Saturated)</text>

        <rect x="14" y="186" width="280" height="44" rx="4" fill="rgba(225,29,72,0.08)" stroke="#e11d48"/>
        <text x="154" y="204" text-anchor="middle" fill="#fca5a5" font-size="9.5" font-weight="600">Max-Flow Min-Cut Theorem Proven:</text>
        <text x="154" y="218" text-anchor="middle" fill="#fca5a5" font-size="9.5" font-family="monospace">Max Flow (720Cr) == Min Cut (720Cr)</text>
      </g>
    </g>
  </g>
</svg>
