<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#0c0d11; font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="ar-def" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title Caption Top -->
  <text x="600" y="32" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="1">FIGURE 4.1: NETWORK TOPOLOGY &amp; INTERBANK OBLIGATION SIMULATOR</text>
  <text x="600" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">D3.js Force-Directed Canvas with Indian Bank Logo Entities, Capital Buffers, and Curved Bilateral Claims</text>

  <!-- App Window Container -->
  <g transform="translate(20, 65)" filter="url(#card-shadow)">
    <!-- Header -->
    <rect width="1160" height="42" rx="6" fill="#121419" stroke="#222631" stroke-width="1"/>
    <text x="24" y="26" fill="#f8fafc" font-size="13" font-weight="700" font-family="'JetBrains Mono', monospace" letter-spacing="1">MNSR ENGINE</text>
    <circle cx="1060" cy="21" r="4" fill="#10b981"/>
    <text x="1072" y="25" fill="#94a3b8" font-size="10" font-family="monospace">CONNECTED</text>

    <!-- Navigation Bar -->
    <rect y="42" width="1160" height="36" fill="#121419" stroke="#222631" stroke-width="1"/>
    <!-- Tab items -->
    <rect x="20" y="42" width="130" height="36" fill="rgba(56,189,248,0.06)"/>
    <line x1="20" y1="77" x2="150" y2="77" stroke="#38bdf8" stroke-width="2"/>
    <text x="85" y="64" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Network Topology</text>
    <text x="220" y="64" text-anchor="middle" fill="#64748b" font-size="11">Multilateral Netting</text>
    <text x="360" y="64" text-anchor="middle" fill="#64748b" font-size="11">Settlement &amp; Gridlock</text>
    <text x="490" y="64" text-anchor="middle" fill="#64748b" font-size="11">Liquidity &amp; Flow</text>
    <text x="610" y="64" text-anchor="middle" fill="#64748b" font-size="11">Crisis Simulator</text>
    <text x="730" y="64" text-anchor="middle" fill="#64748b" font-size="11">Regulator Toolkit</text>

    <!-- Main Workspace Background -->
    <rect y="78" width="840" height="600" fill="#0c0d11"/>
    <!-- Grid Pattern -->
    <g opacity="0.15">
      <line x1="0" y1="150" x2="840" y2="150" stroke="#334155" stroke-dasharray="4,4"/>
      <line x1="0" y1="250" x2="840" y2="250" stroke="#334155" stroke-dasharray="4,4"/>
      <line x1="0" y1="350" x2="840" y2="350" stroke="#334155" stroke-dasharray="4,4"/>
      <line x1="0" y1="450" x2="840" y2="450" stroke="#334155" stroke-dasharray="4,4"/>
      <line x1="0" y1="550" x2="840" y2="550" stroke="#334155" stroke-dasharray="4,4"/>
      <line x1="200" y1="78" x2="200" y2="678" stroke="#334155" stroke-dasharray="4,4"/>
      <line x1="400" y1="78" x2="400" y2="678" stroke="#334155" stroke-dasharray="4,4"/>
      <line x1="600" y1="78" x2="600" y2="678" stroke="#334155" stroke-dasharray="4,4"/>
    </g>

    <!-- Directed Edges & Curved Arcs -->
    <!-- SBI -> HDFC -->
    <path d="M 240 220 A 400 400 0 0 1 480 180" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#ar-def)"/>
    <rect x="330" y="172" width="60" height="18" rx="4" fill="#111317" stroke="#272b35"/>
    <text x="360" y="185" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="monospace">₹800Cr</text>

    <!-- SBI -> ICICI -->
    <path d="M 240 220 A 400 400 0 0 1 320 420" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#ar-def)"/>
    <rect x="250" y="300" width="60" height="18" rx="4" fill="#111317" stroke="#272b35"/>
    <text x="280" y="313" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="monospace">₹600Cr</text>

    <!-- HDFC -> Axis -->
    <path d="M 480 180 A 400 400 0 0 1 650 260" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar-def)"/>
    <rect x="545" y="195" width="60" height="18" rx="4" fill="#111317" stroke="#272b35"/>
    <text x="575" y="208" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="monospace">₹400Cr</text>

    <!-- ICICI -> SBI (Cycle) -->
    <path d="M 320 420 A 400 400 0 0 1 240 220" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar-def)"/>
    <rect x="295" y="325" width="60" height="18" rx="4" fill="#111317" stroke="#272b35"/>
    <text x="325" y="338" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="monospace">₹300Cr</text>

    <!-- Axis -> Kotak -->
    <path d="M 650 260 A 400 400 0 0 1 600 460" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar-def)"/>
    <rect x="610" y="340" width="60" height="18" rx="4" fill="#111317" stroke="#272b35"/>
    <text x="640" y="353" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="monospace">₹280Cr</text>

    <!-- ICICI -> PNB -->
    <path d="M 320 420 A 400 400 0 0 1 450 560" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar-def)"/>
    <rect x="360" y="475" width="60" height="18" rx="4" fill="#111317" stroke="#272b35"/>
    <text x="390" y="488" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="monospace">₹250Cr</text>

    <!-- PNB -> Yes_Bank -->
    <path d="M 450 560 A 400 400 0 0 1 200 560" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#ar-def)"/>
    <rect x="300" y="540" width="60" height="18" rx="4" fill="#111317" stroke="#272b35"/>
    <text x="330" y="553" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="monospace">₹150Cr</text>

    <!-- Yes_Bank -> Canara -->
    <path d="M 200 560 A 400 400 0 0 1 120 380" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#ar-def)"/>
    <rect x="130" y="455" width="60" height="18" rx="4" fill="#111317" stroke="#272b35"/>
    <text x="160" y="468" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="monospace">₹120Cr</text>

    <!-- NODES: Authentic Brand Circles -->
    <!-- Node 1: SBI -->
    <g transform="translate(240, 220)">
      <circle r="32" fill="#14161c" stroke="#28549C" stroke-width="3.5"/>
      <circle r="22" fill="#28549C"/>
      <circle cy="-3" r="7" fill="#FFFFFF"/>
      <rect x="-2" y="-3" width="4" height="18" fill="#FFFFFF"/>
      <text y="46" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">SBI</text>
      <text y="58" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">₹8,000Cr</text>
    </g>

    <!-- Node 2: HDFC -->
    <g transform="translate(480, 180)">
      <circle r="30" fill="#14161c" stroke="#004C8F" stroke-width="3"/>
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#004C8F"/>
      <rect x="-8" y="-8" width="16" height="16" fill="#ED232A"/>
      <text y="44" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">HDFC</text>
      <text y="56" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">₹6,000Cr</text>
    </g>

    <!-- Node 3: ICICI -->
    <g transform="translate(320, 420)">
      <circle r="29" fill="#14161c" stroke="#F58220" stroke-width="3"/>
      <circle r="20" fill="#A81C2E"/>
      <circle cy="-6" r="4" fill="#F58220"/>
      <path d="M-4 0 C2 0 6 8 0 12" fill="none" stroke="#F58220" stroke-width="3"/>
      <text y="44" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">ICICI</text>
      <text y="56" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">₹5,500Cr</text>
    </g>

    <!-- Node 4: Axis -->
    <g transform="translate(650, 260)">
      <circle r="27" fill="#14161c" stroke="#97144D" stroke-width="3"/>
      <circle r="18" fill="#97144D"/>
      <polygon points="0,-10 9,8 -9,8" fill="#FFFFFF"/>
      <text y="42" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Axis</text>
      <text y="54" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">₹4,000Cr</text>
    </g>

    <!-- Node 5: Kotak -->
    <g transform="translate(600, 460)">
      <circle r="26" fill="#14161c" stroke="#ED1C24" stroke-width="3"/>
      <circle r="17" fill="#ED1C24"/>
      <text y="4" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">K</text>
      <text y="40" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Kotak</text>
      <text y="52" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">₹3,500Cr</text>
    </g>

    <!-- Node 6: PNB -->
    <g transform="translate(450, 560)">
      <circle r="26" fill="#14161c" stroke="#A20034" stroke-width="3"/>
      <circle r="17" fill="#A20034"/>
      <circle r="8" fill="none" stroke="#FFCB05" stroke-width="3"/>
      <text y="40" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">PNB</text>
      <text y="52" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">₹3,000Cr</text>
    </g>

    <!-- Node 7: Yes_Bank -->
    <g transform="translate(200, 560)">
      <circle r="25" fill="#14161c" stroke="#005CA9" stroke-width="3"/>
      <circle r="16" fill="#005CA9"/>
      <path d="M-6 0 L-2 4 L8 -6" fill="none" stroke="#ED1C24" stroke-width="3"/>
      <text y="38" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Yes_Bank</text>
      <text y="50" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">₹1,500Cr</text>
    </g>

    <!-- Node 8: Canara -->
    <g transform="translate(120, 380)">
      <circle r="25" fill="#14161c" stroke="#0091DF" stroke-width="3"/>
      <circle r="16" fill="#0091DF"/>
      <polygon points="-6,6 6,6 0,-4" fill="#FFCB05"/>
      <text y="38" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Canara</text>
      <text y="50" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">₹2,500Cr</text>
    </g>

    <!-- Edge Inspector Floating Card (Bottom Left) -->
    <g transform="translate(30, 595)">
      <rect width="210" height="60" rx="6" fill="#181a21" stroke="#2f3442" stroke-width="1"/>
      <text x="14" y="18" fill="#64748b" font-size="9" font-family="monospace" text-transform="uppercase">Selected Obligation</text>
      <text x="14" y="36" fill="#f8fafc" font-size="13" font-weight="600">SBI → HDFC</text>
      <text x="14" y="52" fill="#38bdf8" font-size="13" font-weight="700" font-family="monospace">₹800 Cr</text>
    </g>

    <!-- ================= RIGHT SIDEBAR ================= -->
    <g transform="translate(840, 78)">
      <rect width="320" height="600" fill="#121419" stroke="#222631" stroke-width="1"/>

      <!-- Panel Section 1: Presets -->
      <g transform="translate(16, 16)">
        <rect width="288" height="85" rx="6" fill="#181a21" stroke="#222631"/>
        <text x="14" y="20" fill="#64748b" font-size="10" font-weight="700" font-family="monospace">PRESET SCENARIOS</text>
        <rect x="14" y="32" width="80" height="38" rx="4" fill="rgba(56,189,248,0.06)" stroke="#38bdf8"/>
        <text x="54" y="55" text-anchor="middle" fill="#38bdf8" font-size="10.5" font-weight="600">Normal</text>
        <rect x="104" y="32" width="80" height="38" rx="4" fill="#111317" stroke="#222631"/>
        <text x="144" y="55" text-anchor="middle" fill="#94a3b8" font-size="10.5">Stressed</text>
        <rect x="194" y="32" width="80" height="38" rx="4" fill="#111317" stroke="#222631"/>
        <text x="234" y="55" text-anchor="middle" fill="#e11d48" font-size="10.5">2008 Crisis</text>
      </g>

      <!-- Panel Section 2: Add Obligation -->
      <g transform="translate(16, 115)">
        <rect width="288" height="150" rx="6" fill="#181a21" stroke="#222631"/>
        <text x="14" y="20" fill="#64748b" font-size="10" font-weight="700" font-family="monospace">ADD INTERBANK OBLIGATION</text>
        
        <text x="14" y="42" fill="#94a3b8" font-size="9.5">DEBTOR (FROM)</text>
        <rect x="14" y="48" width="125" height="26" rx="3" fill="#111317" stroke="#2f3442"/>
        <text x="24" y="65" fill="#f8fafc" font-size="10">SBI</text>

        <text x="150" y="42" fill="#94a3b8" font-size="9.5">CREDITOR (TO)</text>
        <rect x="150" y="48" width="125" height="26" rx="3" fill="#111317" stroke="#2f3442"/>
        <text x="160" y="65" fill="#f8fafc" font-size="10">Axis</text>

        <text x="14" y="94" fill="#94a3b8" font-size="9.5">AMOUNT (₹ CR)</text>
        <rect x="14" y="100" width="260" height="26" rx="3" fill="#111317" stroke="#2f3442"/>
        <text x="24" y="117" fill="#f8fafc" font-size="10" font-family="monospace">400</text>

        <rect x="14" y="132" width="260" height="28" rx="4" fill="#38bdf8"/>
        <text x="144" y="150" text-anchor="middle" fill="#0c0d11" font-size="10.5" font-weight="700">INJECT TRANSACTION EDGE</text>
      </g>

      <!-- Panel Section 3: Add Custom Bank -->
      <g transform="translate(16, 280)">
        <rect width="288" height="130" rx="6" fill="#181a21" stroke="#222631"/>
        <text x="14" y="20" fill="#64748b" font-size="10" font-weight="700" font-family="monospace">ADD BANK INSTITUTION</text>

        <text x="14" y="42" fill="#94a3b8" font-size="9.5">INSTITUTION NAME</text>
        <rect x="14" y="48" width="260" height="26" rx="3" fill="#111317" stroke="#2f3442"/>
        <text x="24" y="65" fill="#f8fafc" font-size="10">Federal_Bank</text>

        <rect x="14" y="86" width="260" height="28" rx="4" fill="#111317" stroke="#2f3442"/>
        <text x="144" y="104" text-anchor="middle" fill="#94a3b8" font-size="10.5" font-weight="600">Create Bank Entity</text>
      </g>

      <!-- Panel Section 4: System Metrics -->
      <g transform="translate(16, 425)">
        <rect width="288" height="150" rx="6" fill="#181a21" stroke="#222631"/>
        <text x="14" y="20" fill="#64748b" font-size="10" font-weight="700" font-family="monospace">SYSTEM METRICS</text>

        <!-- Stat 1 -->
        <rect x="14" y="32" width="125" height="46" rx="4" fill="#111317" stroke="#222631"/>
        <text x="24" y="48" fill="#64748b" font-size="9">INSTITUTIONS</text>
        <text x="24" y="68" fill="#f8fafc" font-size="16" font-weight="700" font-family="monospace">8</text>

        <!-- Stat 2 -->
        <rect x="150" y="32" width="125" height="46" rx="4" fill="#111317" stroke="#222631"/>
        <text x="160" y="48" fill="#64748b" font-size="9">ACTIVE LINKS</text>
        <text x="160" y="68" fill="#f8fafc" font-size="16" font-weight="700" font-family="monospace">14</text>

        <!-- Stat 3 -->
        <rect x="14" y="86" width="260" height="52" rx="4" fill="#111317" stroke="#222631"/>
        <text x="24" y="102" fill="#64748b" font-size="9">GROSS OBLIGATION VOLUME</text>
        <text x="24" y="125" fill="#d97706" font-size="17" font-weight="700" font-family="monospace">₹8,400 Cr</text>
      </g>
    </g>
  </g>
</svg>
