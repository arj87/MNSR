        <line x1="14" y1="52" x2="160" y2="52" stroke="#38bdf8" stroke-width="4"/>

        <rect x="14" y="65" width="280" height="36" rx="4" fill="#111317" stroke="#222631"/>
        <text x="24" y="80" fill="#64748b" font-size="9">INTER-CLUSTER CUT EXPOSURE</text>
        <text x="24" y="94" fill="#d97706" font-size="11" font-weight="700" font-family="monospace">₹840 Cr (Minimized Friction)</text>

