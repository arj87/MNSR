    <text x="225" y="64" text-anchor="middle" fill="#64748b" font-size="11">Multilateral Netting</text>
    <text x="365" y="64" text-anchor="middle" fill="#64748b" font-size="11">Settlement &amp; Gridlock</text>
    <text x="495" y="64" text-anchor="middle" fill="#64748b" font-size="11">Liquidity &amp; Flow</text>
    <text x="610" y="64" text-anchor="middle" fill="#64748b" font-size="11">Crisis Simulator</text>
    <!-- Active Tab: Regulator Toolkit -->
