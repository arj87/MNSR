          <rect x="226" width="48" height="20" rx="3" fill="rgba(56,189,248,0.15)" stroke="#38bdf8"/><text x="250" y="14" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="700">PNB</text>
