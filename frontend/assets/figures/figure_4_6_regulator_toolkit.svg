  <text x="600" y="32" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="1">FIGURE 4.6: REGULATOR SUPERVISION &amp; REGIONAL MIN K-CUT PARTITIONING</text>
  <text x="600" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Minimal Vertex Cover Oversight Set (100% Obligation Coverage) &amp; Karger's k-Cut Autonomous Clearing Clusters</text>

