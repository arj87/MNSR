    <text x="85" y="64" text-anchor="middle" fill="#64748b" font-size="11">Network Topology</text>
    <text x="225" y="64" text-anchor="middle" fill="#64748b" font-size="11">Multilateral Netting</text>
    <!-- Active Tab: Settlement -->
