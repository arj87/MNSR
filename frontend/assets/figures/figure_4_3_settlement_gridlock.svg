    <g transform="translate(540, 220)"><circle r="29" fill="#064e3b" stroke="#10b981" stroke-width="3.5"/><text y="4" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">#3 HDFC</text></g>
    <g transform="translate(680, 320)"><circle r="28" fill="#064e3b" stroke="#10b981" stroke-width="3.5"/><text y="4" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">#4 Axis</text></g>
    <g transform="translate(560, 460)"><circle r="28" fill="#064e3b" stroke="#10b981" stroke-width="3.5"/><text y="4" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">#5 ICICI</text></g>
    <g transform="translate(380, 540)"><circle r="27" fill="#064e3b" stroke="#10b981" stroke-width="3.5"/><text y="4" text-anchor="middle" fill="#86efac" font-size="11" font-weight="700">#6 PNB</text></g>
