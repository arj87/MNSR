          <text x="42" y="21" fill="#f8fafc" font-size="11" font-weight="600">HDFC Bank</text>
          <rect x="210" y="9" width="60" height="16" rx="3" fill="rgba(16,185,129,0.15)"/><text x="240" y="21" text-anchor="middle" fill="#86efac" font-size="8.5" font-weight="700">SETTLED</text>
        </g>
        <!-- Queue Item 4 -->
