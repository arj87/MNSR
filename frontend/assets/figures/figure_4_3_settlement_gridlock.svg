    <line x1="300" y1="77" x2="450" y2="77" stroke="#38bdf8" stroke-width="2"/>
    <text x="375" y="64" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Settlement &amp; Gridlock</text>
