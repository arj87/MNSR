<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#0c0d11; font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="ar-green" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <text x="600" y="32" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="1">FIGURE 4.3: PAYMENT SETTLEMENT &amp; GRIDLOCK ISOLATION</text>
  <text x="600" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">Kahn's Topological Sorting of Netted DAG &amp; Tarjan's Strongly Connected Components (SCC) Deadlock Isolation</text>

