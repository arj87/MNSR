          <text x="42" y="21" fill="#f8fafc" font-size="11" font-weight="600">ICICI Bank</text>
          <rect x="210" y="9" width="60" height="16" rx="3" fill="rgba(16,185,129,0.15)"/><text x="240" y="21" text-anchor="middle" fill="#86efac" font-size="8.5" font-weight="700">SETTLED</text>
        </g>
        <!-- Queue Item 6 -->
        <g transform="translate(14, 232)">
          <rect width="280" height="34" rx="4" fill="#111317" stroke="rgba(16,185,129,0.3)"/>
          <circle cx="20" cy="17" r="10" fill="#10b981"/><text x="20" y="21" text-anchor="middle" fill="#0c0d11" font-size="10" font-weight="700">6</text>
          <text x="42" y="21" fill="#f8fafc" font-size="11" font-weight="600">Punjab National Bank</text>
          <rect x="210" y="9" width="60" height="16" rx="3" fill="rgba(16,185,129,0.15)"/><text x="240" y="21" text-anchor="middle" fill="#86efac" font-size="8.5" font-weight="700">SETTLED</text>
        </g>
        <!-- Queue Item 7 -->
        <g transform="translate(14, 272)">
          <rect width="280" height="34" rx="4" fill="#111317" stroke="rgba(16,185,129,0.3)"/>
          <circle cx="20" cy="17" r="10" fill="#10b981"/><text x="20" y="21" text-anchor="middle" fill="#0c0d11" font-size="10" font-weight="700">7</text>
          <text x="42" y="21" fill="#f8fafc" font-size="11" font-weight="600">Yes Bank</text>
          <rect x="210" y="9" width="60" height="16" rx="3" fill="rgba(16,185,129,0.15)"/><text x="240" y="21" text-anchor="middle" fill="#86efac" font-size="8.5" font-weight="700">SETTLED</text>
        </g>
        <!-- Queue Item 8 -->
        <g transform="translate(14, 312)">
          <rect width="280" height="34" rx="4" fill="#111317" stroke="rgba(16,185,129,0.3)"/>
          <circle cx="20" cy="17" r="10" fill="#10b981"/><text x="20" y="21" text-anchor="middle" fill="#0c0d11" font-size="10" font-weight="700">8</text>
          <text x="42" y="21" fill="#f8fafc" font-size="11" font-weight="600">Canara Bank</text>
          <rect x="210" y="9" width="60" height="16" rx="3" fill="rgba(16,185,129,0.15)"/><text x="240" y="21" text-anchor="middle" fill="#86efac" font-size="8.5" font-weight="700">SETTLED</text>
