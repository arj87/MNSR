    <path d="M 360 180 A 400 400 0 0 1 540 220" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#ar-green)"/>
    <path d="M 540 220 A 400 400 0 0 1 680 320" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#ar-green)"/>
