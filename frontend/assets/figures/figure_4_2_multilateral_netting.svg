    <g transform="translate(480, 180)"><circle r="29" fill="#14161c" stroke="#004C8F" stroke-width="3"/><text y="4" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">HDFC</text></g>
    <g transform="translate(320, 420)"><circle r="28" fill="#14161c" stroke="#F58220" stroke-width="3"/><text y="4" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">ICICI</text></g>
    <g transform="translate(650, 260)"><circle r="27" fill="#14161c" stroke="#97144D" stroke-width="3"/><text y="4" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="700">Axis</text></g>
