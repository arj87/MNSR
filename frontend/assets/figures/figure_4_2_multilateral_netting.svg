        <text x="22" y="48" fill="#fca5a5" font-size="9.5" font-family="monospace">[CYCLE] SBI → HDFC → ICICI → SBI (₹300Cr)</text>
        <text x="22" y="66" fill="#fde047" font-size="9.5" font-family="monospace">[REDUCE] SBI → HDFC (-₹300Cr → ₹500Cr)</text>
        <text x="22" y="84" fill="#64748b" font-size="9.5" font-family="monospace">[CLEARED] ICICI → SBI debt loop eliminated</text>
        <text x="22" y="102" fill="#fca5a5" font-size="9.5" font-family="monospace">[CYCLE] HDFC → Kotak → SBI → HDFC (₹180Cr)</text>
        <text x="22" y="120" fill="#86efac" font-size="9.5" font-family="monospace">[COMPLETE] Graph transformed into strict DAG</text>
