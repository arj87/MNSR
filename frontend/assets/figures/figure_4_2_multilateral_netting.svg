        <text x="120" y="190" fill="#e11d48" font-size="10" font-family="monospace">-₹130 Cr</text>
        <rect x="220" y="178" width="68" height="16" rx="3" fill="rgba(225,29,72,0.1)"/>
        <text x="254" y="190" text-anchor="middle" fill="#fca5a5" font-size="8.5" font-weight="700">DEBTOR</text>

