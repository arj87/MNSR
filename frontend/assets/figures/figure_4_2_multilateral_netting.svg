        <text x="120" y="118" fill="#e11d48" font-size="10" font-family="monospace">-₹210 Cr</text>
        <rect x="220" y="106" width="68" height="16" rx="3" fill="rgba(225,29,72,0.1)"/>
        <text x="254" y="118" text-anchor="middle" fill="#fca5a5" font-size="8.5" font-weight="700">DEBTOR</text>

        <!-- Row 4: Axis -->
        <text x="24" y="142" fill="#f8fafc" font-size="10" font-weight="600">Axis</text>
        <text x="120" y="142" fill="#e11d48" font-size="10" font-family="monospace">-₹180 Cr</text>
        <rect x="220" y="130" width="68" height="16" rx="3" fill="rgba(225,29,72,0.1)"/>
        <text x="254" y="142" text-anchor="middle" fill="#fca5a5" font-size="8.5" font-weight="700">DEBTOR</text>

        <!-- Row 5: Kotak -->
        <text x="24" y="166" fill="#f8fafc" font-size="10" font-weight="600">Kotak</text>
        <text x="120" y="166" fill="#10b981" font-size="10" font-family="monospace">+₹90 Cr</text>
        <rect x="220" y="154" width="68" height="16" rx="3" fill="rgba(16,185,129,0.1)"/>
        <text x="254" y="166" text-anchor="middle" fill="#86efac" font-size="8.5" font-weight="700">CREDITOR</text>

        <!-- Row 6: PNB -->
