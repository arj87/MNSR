    <text x="610" y="64" text-anchor="middle" fill="#64748b" font-size="11">Crisis Simulator</text>
    <text x="730" y="64" text-anchor="middle" fill="#64748b" font-size="11">Regulator Toolkit</text>

    <!-- Canvas (Netting Result) -->
    <rect y="78" width="820" height="600" fill="#0c0d11"/>

    <!-- Netted DAG Edges (Remaining after cycle cancellation) -->
    <!-- SBI -> HDFC (Reduced from 800 to 500) -->
    <path d="M 240 220 A 400 400 0 0 1 480 180" fill="none" stroke="#38bdf8" stroke-width="2.8" marker-end="url(#ar-active)"/>
    <rect x="335" y="172" width="55" height="18" rx="4" fill="#111317" stroke="#38bdf8"/>
    <text x="362" y="185" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-family="monospace">₹500Cr</text>

