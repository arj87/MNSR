    <path d="M 480 180 A 400 400 0 0 1 650 260" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ar-active)"/>
    <rect x="545" y="195" width="55" height="18" rx="4" fill="#111317" stroke="#38bdf8"/>
    <text x="572" y="208" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-family="monospace">₹220Cr</text>

